name: Room Schema Backfill (authoritative exports)

# U-08 follow-up (p3-next §2.1): the committed Room schemas for v8..v13 were
# hand-derived, and a hand-derived export carries a fabricated identityHash —
# the migration device test then validates against a WRONG expectation, i.e.
# the U-07 regression net can be a false green.
#
# This workflow regenerates the historical exports the authoritative way:
# check out each historical tag, run the Room KSP export, and upload the
# generated JSON as an artifact. The exports are then committed verbatim
# (and the hand-derived files deleted), after which
# `.github/workflows/build.yml`'s "Room schema drift" step keeps the CURRENT
# version honest on every push.
#
# Dispatch-only: six historical Gradle builds are expensive and the output
# only changes when the schemas themselves change.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma-separated versions to regenerate (empty = all known)'
        required: false
        default: ''

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  backfill:
    name: 'Backfill v${{ matrix.version }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '8',  tag: 'bb6e9a6c20491e144729beac5f391596033c6721' }
          - { version: '9',  tag: '53dbe0105f8d81bc8e54fc603e34108e11bc00a8' }
          - { version: '10', tag: 'dfd53a6fe1fa9bb2ea56896c60f20e93d1eb3a00' }
          - { version: '11', tag: '67f220f3fedd670c188a11d9c3c610534623527c' }
          - { version: '12', tag: '9c176a2e66b3d87c3733c52e4d9dedf91186b235' }
          - { version: '13', tag: 'c8c35b62c9282b6f3020a48f959a6e9649e374e4' }
    steps:
      - name: Checkout historical tag
        # The ref MUST be the FULL 40-hex SHA: actions/checkout resolves a
        # short SHA as a BRANCH name (`+refs/heads/<short>*`) and the fetch
        # then fails with "git failed with exit code 1" — the whole matrix
        # died at the checkout, six times over.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ matrix.tag }}
          fetch-depth: 1

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Configure the Android SDK path
        # The historical tags have no local.properties (it is git-ignored), and
        # the Android Gradle plugin fails the build without an SDK path.
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_DIR" ]]; then
            for CANDIDATE in /usr/local/lib/android/sdk /opt/android-sdk /opt/hostedtoolcache/Android/Sdk; do
              if [[ -d "$CANDIDATE" ]]; then
                SDK_DIR="$CANDIDATE"
                break
              fi
            done
          fi
          if [[ -z "$SDK_DIR" ]]; then
            echo "Android SDK directory could not be determined." >&2
            exit 1
          fi
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Make gradlew executable
        # The historical commits do not carry the wrapper's executable bit, so
        # "./gradlew" fails with "Permission denied".
        run: chmod +x ./gradlew

      - name: Pin the Firebase BoM to the last KTX-providing version
        # The historical tags pin firebase-bom 34.2.0, and BoM 34.0.0 dropped
        # the KTX artifacts (firebase-auth-ktx and friends), so the historical
        # module no longer RESOLVES: "Could not find
        # com.google.firebase:firebase-auth-ktx:." (the BoM supplied the
        # version, and the BoM no longer lists the artifact).
        # The Room schema does not depend on Firebase at all — the module only
        # has to RESOLVE so that KSP can export the schema. BoM 33.1.2 is the
        # last version that still provides the KTX artifacts.
        run: |
          set -euo pipefail
          sed -i 's/^firebase-bom = ".*"$/firebase-bom = "33.1.2"/' gradle/libs.versions.toml
          grep -n '^firebase-bom' gradle/libs.versions.toml

      - name: Make the historical module buildable with the current toolchain
        # The Room export needs the historical module to COMPILE, and the
        # historical tags predate several toolchain changes. Three
        # mechanical patches, none of which touches the Room entities:
        #  1. the historical tags did not export Room schemas AT ALL (the
        #     room.schemaLocation KSP arg came later) -> switch it on;
        #  2. the modern resource merger rejects a DUPLICATE string name
        #     ("Found item String/widget_size_small more than one time");
        #  3. it also rejects a resource whose name is a Java keyword
        #     ("import is not a valid resource name") -> rename it and its
        #     Kotlin references (Kotlin 2.x refuses `import` as an
        #     identifier too).
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import pathlib, re

          KEYWORDS = {
              "abstract", "assert", "boolean", "break", "byte", "case", "catch",
              "char", "class", "const", "continue", "default", "do", "double",
              "else", "enum", "extends", "final", "finally", "float", "for",
              "goto", "if", "implements", "import", "instanceof", "int",
              "interface", "long", "native", "new", "package", "private",
              "protected", "public", "return", "short", "static", "strictfp",
              "super", "switch", "synchronized", "this", "throw", "throws",
              "transient", "try", "void", "volatile", "while",
          }

          # Resource names that clash with a LIBRARY's copy - the modern
          # merger rejects those ("Found item String/widget_size_small more
          # than one time"), while the era's merger only warned.
          CLASH = {"widget_size_small"}

          app = pathlib.Path("app")

          # 1. switch the Room export on
          gradle = app / "build.gradle.kts"
          text = gradle.read_text()
          if "room.schemaLocation" not in text:
              gradle.write_text(
                  text + '\nksp { arg("room.schemaLocation", "$projectDir/schemas") }\n'
              )
              print("room.schemaLocation injected")
          else:
              print("room.schemaLocation already present")

          # 2 + 3. the strings: drop duplicates, rename the reserved names
          strings = app / "src/main/res/values/strings.xml"
          renamed = {}
          if strings.exists():
              seen = set()
              kept = []
              for line in strings.read_text().split("\n"):
                  m = re.search(r'<string name="([^"]+)"', line)
                  if m:
                      name = m.group(1)
                      if name in seen:
                          continue  # a duplicate -> drop it
                      seen.add(name)
                      if name in KEYWORDS or name in CLASH:
                          new = name + "_name"
                          renamed[name] = new
                          line = line.replace('name="%s"' % name, 'name="%s"' % new)
                  kept.append(line)
              strings.write_text("\n".join(kept))
              print("renamed reserved resource names: %s" % (renamed or "none"))

          # 3b. an import BEFORE the package declaration: legal for the
          # era's compiler, an ERROR in Kotlin 2.x ("imports are only allowed
          # in the beginning") -> move the leading imports below the package.
          for kt in app.rglob("*.kt"):
              lines = kt.read_text().split("\n")
              pkg = next((i for i, l in enumerate(lines) if l.startswith("package ")), None)
              if pkg is None:
                  continue
              head = lines[:pkg]
              imports = [l for l in head if l.startswith("import ")]
              if not imports:
                  continue
              rest = [l for l in head if not l.startswith("import ")]
              kt.write_text("\n".join(rest + [lines[pkg]] + imports + lines[pkg + 1:]))
              print("moved the leading imports below the package in %s" % kt)

          # 3c. the Kotlin references of the renamed resources
          for kt in app.rglob("*.kt"):
              source = kt.read_text()
              patched = source
              for old_name, new_name in renamed.items():
                  # \b matters: "R.string.import" must NOT match
                  # "R.string.import_external_manga" (the underscore is a
                  # word character, so \b does not match there).
                  patched = re.sub(
                      r"R\.string\.%s\b" % re.escape(old_name),
                      "R.string.%s" % new_name,
                      patched,
                  )
                  patched = re.sub(
                      r"R\.string\.`%s`\b" % re.escape(old_name),
                      "R.string.%s" % new_name,
                      patched,
                  )
              if patched != source:
                  kt.write_text(patched)
                  print("patched %s" % kt)
          print("historical module patched")
          PYEOF

      - name: Export Room schema
        # The historical tags need a google-services.json to configure; the
        # google-services Gradle plugin fails the build without one.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "${GOOGLE_SERVICES_JSON:-}" ]]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          # --no-build-cache: the schema export is an OUT-OF-BUILD-DIR sidecar,
          # so a FROM-CACHE hit restores the classes but never regenerates the
          # schema (the current build disables the cache for the KSP tasks for
          # the same reason; the historical tags predate that guard).
          ./gradlew :app:kspDebugKotlin --stacktrace --no-build-cache

      - name: Collect the exported schema
        run: |
          set -euo pipefail
          # The export directory is named after the database class, and that
          # class was renamed over the years - so find the file instead of
          # assuming today's path.
          dir="$(dirname "$(find app/schemas -name "${{ matrix.version }}.json" -type f | head -n 1)")"
          if [[ -z "$dir" || "$dir" == "." ]]; then
            echo "::error::tag ${{ matrix.tag }} did not export ${{ matrix.version }}.json"
            ls -laR app/schemas 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "identityHash of the regenerated export:"
          python3 -c "import json;print(json.load(open('$dir/${{ matrix.version }}.json'))['database']['identityHash'])"
          mkdir -p "out/${{ matrix.version }}"
          cp "$dir/${{ matrix.version }}.json" "out/${{ matrix.version }}/${{ matrix.version }}.json"

      - name: Upload the regenerated export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: room-schema-v${{ matrix.version }}
          path: out/${{ matrix.version }}/${{ matrix.version }}.json
          if-no-files-found: error
          retention-days: 30
