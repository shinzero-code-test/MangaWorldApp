name: Build MangaWorld APK

permissions:
  contents: read

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
  # Daily drift watch for the deployed plugin distribution. Promotion is a manual
  # `vercel --prod`, so drift can appear (or a fix can go missing) with no commit
  # at all — the scheduled run is the only check that notices on a quiet day.
  schedule:
    - cron: '17 6 * * *'

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

concurrency:
  # github.event_name in the group: the daily schedule lands on refs/heads/main,
  # the same ref as a main push, so with the old group the 06:17 drift run and a
  # real build cancelled each other (only one survives). Separate groups per event;
  # the schedule additionally never cancels and is never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # ─── Lint & Unit Tests ──────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    # Tag pushes only cut the release: the same commit already passed
    # lint/tests/debug on its main-branch push, so re-running them here just
    # burns runners and delays the release. The daily `schedule` trigger exists
    # for the deployed-distribution drift check alone (which is a few public GETs),
    # so the Android pipeline stands down for it — every push/PR/tag path is
    # unchanged.
    if: "github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')"
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create google-services.json from secret
        if: env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_DIR" ]]; then
            for CANDIDATE in /usr/local/lib/android/sdk /opt/android-sdk /opt/hostedtoolcache/Android/Sdk; do
              if [[ -d "$CANDIDATE" ]]; then
                SDK_DIR="$CANDIDATE"
                break
              fi
            done
          fi
          if [[ -z "$SDK_DIR" ]]; then
            echo "Android SDK directory could not be determined." >&2
            exit 1
          fi
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Run Unit Tests
        # Bounded so a hanging test fails the step (partial XMLs still upload
        # via the always() results step) instead of burning the 6h job limit.
        timeout-minutes: 30
        run: ./gradlew :app:testDebugUnitTest --stacktrace


      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

      # Room schemas are the migration safety net: exportSchema=true writes them
      # here on every compile. Published as artifacts so migration review never
      # needs a local build (and so missing schemas fail visibly, not silently).
      # Explicit KSP invocation: the schemas live outside buildDir, so a Gradle
      # cache hit on compile tasks could otherwise skip their regeneration.
      - name: Generate Room Schemas
        run: ./gradlew :app:kspDebugKotlin --stacktrace

      - name: Upload Room Schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/**/*.json
          if-no-files-found: error
          retention-days: 30

  # ─── Dashboard Checks ───────────────────────────────────────────────────────
  # The admin dashboard ships to Vercel with zero test coverage; at minimum its
  # typecheck must gate like the app's lint/tests do. ESLint stays advisory
  # until the `any`-debt baseline is clean (see F6).
  dashboard-checks:
    name: Dashboard Typecheck & Lint
    runs-on: ubuntu-latest
    # Tag pushes only cut the release (same rationale as lint-and-test). The
    # daily schedule skips it too, but re-runs the signature gate it owns through
    # verify-deployed-plugins so the committed tree stays covered on quiet days.
    if: "github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Typecheck
        working-directory: dashboard
        run: npm run typecheck

      - name: Unit tests
        working-directory: dashboard
        run: npm test

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Plugin distribution checks
        # 3.5/4.3: dashboard-only edits (index typo, manifest host swap,
        # pin drift, sha256 mismatch) merge with no app-side cover.
        run: |
          python3 -m pip install --quiet cryptography
          python3 dashboard/scripts/sign-plugin.py --selftest
          python3 dashboard/scripts/sign-plugin.py --check-published

  # ─── Firestore Rules Verification ───────────────────────────────────────────
  # Boots the Firestore emulator with the shipped rules + indexes and replays
  # the app's exact public-library query (visitor/owner/denied/legacy/anon).
  # A rules change that breaks provability or privacy fails here instead of in
  # prod (PL-1). Tag pushes skip like every other check job, and so does the daily
  # schedule (an emulator boot per day for a plugin-drift watch is not a trade).
  firestore-rules:
    name: Firestore Rules Verification
    runs-on: ubuntu-latest
    if: "github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up JDK 21 (Firestore emulator requirement)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify rules in emulator
        run: firebase emulators:exec --only firestore "node scripts/verify-firestore-rules.mjs"
        working-directory: dashboard

  # ─── Deployed Plugin Distribution ───────────────────────────────────────────
  # --check-published proves the COMMITTED tree is signed and well-formed. It
  # cannot see what is actually SERVED: vercel.json sets deploymentEnabled:false
  # and promotion is a manual `vercel --prod`, so the distribution once "had NEVER
  # been live" with every repository-side check green. This job is the other half
  # — it reads the live bytes and re-verifies them with the same JCS/Ed25519 code
  # path and the same committed public pin the app uses, so a tampered payload, a
  # manifest host swap, a swapped source.js, a missing promotion or an expiring
  # trust anchor fails CI even when nobody pushes.
  # READ-ONLY: public GETs, no secrets (the distribution is public and the pin is
  # a committed public key), no deploy, no write outside the runner's temp dir.
  # NOT in build-release's needs on purpose: served state is an external service,
  # and a Vercel hiccup must not be able to block a release that is otherwise
  # green. Drift surfaces here (red on push/PR, red daily) instead.
  verify-deployed-plugins:
    name: Verify Deployed Plugins
    runs-on: ubuntu-latest
    # Tag pushes only cut the release. Every other trigger runs it: main pushes,
    # PRs (so a distribution change can never be reviewed blind) and the daily
    # schedule (so drift is caught on a quiet day, not just on a commit).
    if: "!startsWith(github.ref, 'refs/tags/')"
    env:
      PLUGIN_INDEX_URL: https://mangaworld-admin.vercel.app/plugins/index.json
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crypto dependency
        # Same single dependency the existing signature gate uses (Ed25519).
        run: python3 -m pip install --quiet --disable-pip-version-check cryptography

      # Committed-tree side of the plugin gate. Redundant with dashboard-checks on
      # push/PR (identical command, identical signal), but the daily schedule does
      # not run that job — so without this step the distribution would only be
      # re-checked on days somebody happened to push.
      - name: Committed distribution + pin agreement
        run: |
          python3 dashboard/scripts/sign-plugin.py --selftest
          python3 dashboard/scripts/sign-plugin.py --check-published

      - name: Verify served distribution
        # `runner.temp` is NOT available in job-level env (GitHub rejects the
        # workflow file outright), so the mirror path is a step-level env.
        env:
          PLUGIN_MIRROR: ${{ runner.temp }}/deployed-plugins
        run: |
          set -euo pipefail
          mkdir -p "$PLUGIN_MIRROR"
          python3 dashboard/scripts/verify-deployed-plugins.py \
            --index-url "$PLUGIN_INDEX_URL" \
            --pin-source dashboard/lib/plugin-keys.ts \
            --mirror "$PLUGIN_MIRROR" \
            --archive-dir dashboard/plugins/_archive \
            --trust-window-days 90 \
            --warn-window-days 30

      - name: Upload served bytes (failure forensics)
        # The exact bytes that were served, so a promotion that shipped something
        # else cannot hide behind a green re-run.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-plugins-mirror
          path: ${{ env.PLUGIN_MIRROR }}
          if-no-files-found: ignore
          retention-days: 30

  # ─── Firebase Test Lab ──────────────────────────────────────────────────────
  # On-device plugin invariants. The JVM suite cannot touch the real APK assets,
  # the real Room index or the real boot path -- which is exactly where the
  # "source vanished from every list" class of bug lives (a record with a version
  # but no runner is filtered out of Home/Browse/Search, so the user sees nothing
  # and no error). Test Lab installs the app FRESH on every run, so this is also
  # the only place the first-install path is exercised continuously.
  #
  # NOT in build-release's needs: a release must not be blocked by device
  # infrastructure. It is reported in the summary and fails the branch on a real
  # regression. Promote it to a release gate once it has proven stable.
  firebase-test-lab:
    name: Firebase Test Lab (on-device plugin invariants)
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # Virtual device: cheap, and the invariants are not device-specific.
      # Physical models (Pixel 10 Pro, Galaxy S25 Ultra) cost real quota.
      TESTLAB_DEVICE: model=MediumPhone.arm,version=34
    if: |
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create google-services.json from secret
        # The Google Services plugin refuses to run without it, so the debug
        # build fails before a single test is compiled.
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-testlab-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-testlab-${{ runner.os }}-

      - name: Build debug + androidTest APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Activate the service account
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          gcloud config set project mangaworld-live-260519

      - name: Run on-device plugin invariants
        run: |
          set -euo pipefail
          # Discover by name, not by a guessed path: AGP's androidTest output name
          # differs from the app's, and a wrong glob fails the run before Test Lab
          # is even reached.
          echo "apk outputs:"; find app/build/outputs/apk -name "*.apk" || true
          # Prefer the universal APK (one artifact for every ABI the device may be);
          # fall back to whatever the build produced.
          app_apk=$(find app/build/outputs/apk/debug -name "app-universal-debug.apk" | head -n 1)
          if [[ -z "$app_apk" ]]; then
            app_apk=$(find app/build/outputs/apk/debug -name "*.apk" ! -name "*androidTest*" | head -n 1)
          fi
          test_apk=$(find app/build/outputs/apk/androidTest -name "*androidTest*.apk" | head -n 1)
          if [[ -z "$app_apk" || -z "$test_apk" ]]; then
            echo "::error::could not locate the app/test APKs"; exit 1
          fi
          echo "app=$app_apk"
          echo "test=$test_apk"
          # No --results-bucket: the CLI provisions its own staging/results bucket.
          # A named bucket in this project cannot be created (the project's
          # billing account is not in an enabled state), so the default path is
          # the only one that works here.
          gcloud firebase test android run \
            --type instrumentation \
            --app "$app_apk" \
            --test "$test_apk" \
            --device "$TESTLAB_DEVICE" \
            --timeout 25m \
            --results-dir="testlab/$(date -u +%Y%m%d-%H%M%S)-${{ github.sha }}" \
            2>&1 | tee testlab-run.log
          echo "TEST_LAB_PASSED=1" >> "$GITHUB_ENV"

      - name: Collect the on-device test report
        if: always()
        run: |
          set -uo pipefail
          # The CLI provisions its own RANDOM staging/results bucket (a named
          # bucket cannot be created in this project), so find it by prefix and
          # pull the report out of it -- otherwise a failure leaves no evidence
          # beyond the console URL.
          # The CLI prints the bucket it used ("Raw results will be stored in your
          # GCS bucket at [...]"); buckets.list does NOT show it, so parse the log.
          bucket=$(grep -oE "test-lab-[a-z0-9-]+" testlab-run.log 2>/dev/null | head -n 1)
          echo "results bucket: ${bucket:-none}"
          if [[ -n "${bucket:-}" ]]; then
            mkdir -p testlab
            gcloud storage cp --recursive "gs://${bucket}/testlab" testlab/ || true
            # The raw results include the device video and screenshots: ~130 MB of
            # incompressible media that would drown the artifact. The report and
            # the logcat are what a failure is actually read from.
            find testlab -name "*.mp4" -delete 2>/dev/null || true
            find testlab -type f -size +8M -delete 2>/dev/null || true
          fi

      - name: Upload on-device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testlab-results
          path: testlab/
          if-no-files-found: ignore
          retention-days: 30

  # ─── Debug Build ────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APKs (All ABIs)
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_APP_DISTRIBUTION_GROUPS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_GROUPS }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    if: |
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both'))
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create google-services.json from secret
        if: env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_DIR" ]]; then
            for CANDIDATE in /usr/local/lib/android/sdk /opt/android-sdk /opt/hostedtoolcache/Android/Sdk; do
              if [[ -d "$CANDIDATE" ]]; then
                SDK_DIR="$CANDIDATE"
                break
              fi
            done
          fi
          if [[ -z "$SDK_DIR" ]]; then
            echo "Android SDK directory could not be determined." >&2
            exit 1
          fi
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs
        run: ./gradlew :app:assembleDebug --stacktrace

      # Device-test APK for Firebase Test Lab instrumentation runs. Built here
      # (never locally) from app/src/androidTest; uploaded beside the debug
      # APKs so gcloud runs need no local build.
      - name: Build AndroidTest APK
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Resolve Firebase app id
        if: github.event_name == 'push'
        id: firebase-app
        shell: bash
        run: |
          set -euo pipefail
          app_id=$(python -c "import json; print(json.load(open('app/google-services.json', 'r', encoding='utf-8'))['client'][0]['client_info']['mobilesdk_app_id'])")
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for Firebase CLI
        if: github.event_name == 'push' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        if: github.event_name == 'push' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npm install -g firebase-tools

      - name: Distribute internal debug build
        if: github.event_name == 'push' && env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*universal*.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No universal debug APK found; skipping App Distribution."
            exit 0
          fi
          groups="${FIREBASE_APP_DISTRIBUTION_GROUPS:-internal-testers}"
          # Tag/branch names are pusher-controlled: sanitize before interpolation
          # or a crafted tag name breaks out of the release-notes string (F3).
          safe_ref="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/_}"
          firebase appdistribution:distribute "${apks[0]}" \
            --app "${{ steps.firebase-app.outputs.app_id }}" \
            --groups "$groups" \
            --release-notes "Internal debug build from ${safe_ref} (${GITHUB_SHA::7})"

      - name: List APK files
        run: find app/build/outputs/apk -name "*.apk" -type f

      - name: Upload arm64-v8a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaWorld-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaWorld-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaWorld-debug-x86_64
          path: app/build/outputs/apk/debug/*x86_64*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaWorld-debug-x86
          path: |
            app/build/outputs/apk/debug/*x86*.apk
            !app/build/outputs/apk/debug/*x86_64*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Universal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaWorld-debug-universal
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AndroidTest APK (FTL instrumentation)
        uses: actions/upload-artifact@v4
        with:
          name: MangaWorld-debug-androidTest
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # ─── Release Build ──────────────────────────────────────────────────────────
  build-release:
    name: Build Release APKs (All ABIs)
    runs-on: ubuntu-latest
    # dashboard-checks owns the plugin signature gate (--selftest /
    # --check-published): without it here, a mis-signed or tampered promoted
    # manifest shipped in a release APK with every check green (audit C1).
    needs: [lint-and-test, dashboard-checks, firestore-rules]
    # A skipped check (tag pushes) must NOT gate the release: needs.*.result
    # would otherwise skip this job too. Branch pushes still require green
    # lint/tests/dashboard(signature gate)/rules; tag pushes (already validated on
    # main) proceed regardless. A `failure` result blocks branch pushes and PRs.
    if: |
      always() && ((needs.lint-and-test.result == 'success' && needs.dashboard-checks.result == 'success' && needs.firestore-rules.result == 'success') || startsWith(github.ref, 'refs/tags/')) && (
        github.event_name == 'push' ||
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both'))
      )
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_APP_DISTRIBUTION_GROUPS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_GROUPS }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create google-services.json from secret
        if: env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_DIR" ]]; then
            for CANDIDATE in /usr/local/lib/android/sdk /opt/android-sdk /opt/hostedtoolcache/Android/Sdk; do
              if [[ -d "$CANDIDATE" ]]; then
                SDK_DIR="$CANDIDATE"
                break
              fi
            done
          fi
          if [[ -z "$SDK_DIR" ]]; then
            echo "Android SDK directory could not be determined." >&2
            exit 1
          fi
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── Keystore setup ──────────────────────────────────────────────────────
      - name: Determine release signing status
        id: signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Using signed release build."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release artifacts will be unsigned and will not be distributed."
          fi

      - name: Build Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace

      - name: Resolve Firebase app id
        if: github.event_name == 'push' && steps.signing.outputs.signed == 'true'
        id: firebase-app
        shell: bash
        run: |
          set -euo pipefail
          app_id=$(python -c "import json; print(json.load(open('app/google-services.json', 'r', encoding='utf-8'))['client'][0]['client_info']['mobilesdk_app_id'])")
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for Firebase CLI
        if: github.event_name == 'push' && steps.signing.outputs.signed == 'true' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        if: github.event_name == 'push' && steps.signing.outputs.signed == 'true' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npm install -g firebase-tools

      - name: Distribute internal release build
        if: github.event_name == 'push' && steps.signing.outputs.signed == 'true' && env.FIREBASE_SERVICE_ACCOUNT != '' && env.RELEASE_CERT_SHA256 != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*universal*.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No universal release APK found; skipping App Distribution."
            exit 0
          fi
          actual_fingerprint=$(keytool -printcert -jarfile "${apks[0]}" | awk -F': ' '/SHA256:/{print $2}')
          expected_fingerprint=${RELEASE_CERT_SHA256//:/}
          actual_fingerprint=${actual_fingerprint//:/}
          if [[ -z "$actual_fingerprint" || "${actual_fingerprint^^}" != "${expected_fingerprint^^}" ]]; then
            echo "Release certificate fingerprint verification failed." >&2
            exit 1
          fi
          groups="${FIREBASE_APP_DISTRIBUTION_GROUPS:-internal-testers}"
          safe_ref="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/_}"
          firebase appdistribution:distribute "${apks[0]}" \
            --app "${{ steps.firebase-app.outputs.app_id }}" \
            --groups "$groups" \
            --release-notes "Internal release build from ${safe_ref} (${GITHUB_SHA::7})"

      - name: List output files
        run: |
          echo "=== APKs ==="
          find app/build/outputs/apk -name "*.apk" -type f

      # ── Upload APKs per ABI ─────────────────────────────────────────────────
      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaWorld-release-arm64-v8a
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload armeabi-v7a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaWorld-release-armeabi-v7a
          path: app/build/outputs/apk/release/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload x86 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaWorld-release-x86
          path: |
            app/build/outputs/apk/release/*x86*.apk
            !app/build/outputs/apk/release/*x86_64*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload x86_64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaWorld-release-x86_64
          path: app/build/outputs/apk/release/*x86_64*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaWorld-release-universal
          path: app/build/outputs/apk/release/*universal*.apk
          if-no-files-found: error
          retention-days: 90

      # v9.1.5: R8 mapping for deobfuscating fleet logcat stacks (the minified
      # `sync manonga -> p` dead end). Never shipped in-app; CI artifact only.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: MangaWorld-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

  # ─── GitHub Release ─────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # build-release already gates on dashboard-checks; naming it here too records
    # the plugin signature gate on the publishing job itself, so a future edit to
    # build-release's condition cannot silently unhook it from the release DAG.
    needs: [build-release, dashboard-checks]
    # always(): without it, the skipped lint job on tag pushes transitively
    # skips this job before its condition is even evaluated (same trap as
    # build-release had). The signed-gate lives in a step below so an
    # unsigned build warns loudly instead of vanishing silently.
    # Deliberately NOT `needs.dashboard-checks.result == 'success'` here: on tag
    # pushes that job is skipped by design (the tagged commit already passed it on
    # main), and requiring success would block every release. Its failure blocks
    # earlier, in build-release, which is where branch pushes and PRs are held.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build-release.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require signed build for publication
        run: |
          if [[ "${{ needs.build-release.outputs.signed }}" != "true" ]]; then
            echo "::warning::Release build was unsigned — publication skipped."
            echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Download all APK artifacts
        if: env.SKIP_PUBLISH != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: MangaWorld-release-*
          merge-multiple: false
          path: release-artifacts/

      - name: List downloaded artifacts
        if: env.SKIP_PUBLISH != 'true'
        run: find release-artifacts -type f

      - name: Create Release
        if: env.SKIP_PUBLISH != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MangaWorld ${{ github.ref_name }}"
          body: |
            ## 📦 MangaWorld ${{ github.ref_name }}

            ### التنزيل
            اختر APK المناسب لجهازك:

            | الجهاز | الملف |
            |--------|-------|
            | معظم الأجهزة الحديثة (64-bit) | `MangaWorld-release-arm64-v8a` |
            | أجهزة قديمة (32-bit) | `MangaWorld-release-armeabi-v7a` |
            | محاكي (x86_64) | `MangaWorld-release-x86_64` |
            | جميع الأجهزة (universal) | `MangaWorld-release-universal` |

            ### المصادر المدعومة
            - ✅ Olympus Staff / تيم اكس (olympustaff.com)
            - ✅ Azora Moon (azorafly.com)
            - ✅ Manga Starz (starzmanga.com)
            - ✅ MangaSid (mangasid.com)
            - ✅ MeshManga / مانجا سوات (meshmanga.com)
            - ✅ مانجا العاشق (3asq.online)
            - ✅ مانجا ليك (mangalik.net)
            - ✅ مانجا ليك اونلاين (lekmanga.online)
            - ✅ مانجا لايك (like-manga.net)
            - ✅ مانجا لينك (link-manga.net)
            - ✅ مانجا ليكو (manga-leko.site)
            - ✅ مانجا ليونز (manga-lionz.org)
            - ✅ آريا مانجا (ar.kenmanga.com)
            - ✅ حجالة مانجا (hijala.com)
            - ✅ لاڤا سكانز (lavascans.com)
            - ✅ StellarSaber (stellarsaber.pro)
            - ✅ ProChan (procomic.pro)
            - ✅ روكس مانجا (rocksmanga.com)

            ### المتطلبات
            - Android 8.0+ (API 26)
          files: |
            release-artifacts/**/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          fail_on_unmatched_files: true

  # ─── Artifact Verification ───────────────────────────────────────────────────
  verify-debug-artifacts:
    name: Verify Debug Artifacts
    runs-on: ubuntu-latest
    needs: build-debug
    if: always() && needs.build-debug.result == 'success'
    steps:
      - name: Download debug artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MangaWorld-debug-*
          merge-multiple: true
          path: verify-debug/

      - name: Ensure debug APKs exist
        shell: bash
        run: |
          set -euo pipefail
          count=$(find verify-debug -type f -name "*.apk" | wc -l | tr -d ' ')
          echo "Debug APK count: $count"
          if [[ "$count" -lt 1 ]]; then
            echo "No debug APK artifacts found." >&2
            exit 1
          fi

  verify-release-artifacts:
    name: Verify Release Artifacts
    runs-on: ubuntu-latest
    needs: build-release
    if: always() && needs.build-release.result == 'success'
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MangaWorld-release-*
          merge-multiple: true
          path: verify-release/

      - name: Ensure release APKs exist
        shell: bash
        run: |
          set -euo pipefail
          apk_count=$(find verify-release -type f -name "*.apk" | wc -l | tr -d ' ')
          echo "Release APK count: $apk_count"
          if [[ "$apk_count" -lt 1 ]]; then
            echo "No release APK artifacts found." >&2
            exit 1
          fi

  # ─── Build Summary ──────────────────────────────────────────────────────────
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [ lint-and-test, dashboard-checks, firestore-rules, verify-deployed-plugins, firebase-test-lab, build-debug, verify-debug-artifacts, build-release, verify-release-artifacts, create-release ]
    if: always()
    steps:
      - name: Debug release gating contexts
        run: |
          echo "ref=${{ github.ref }}"
          echo "build-release result=${{ needs.build-release.result }}"
          echo "signed output=[${{ needs.build-release.outputs.signed }}]"
      - name: Summary
        run: |
          echo "## 🎌 MangaWorld Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Tests | ${{ needs.lint-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard & Plugin Signature Gate | ${{ needs.dashboard-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firestore Rules | ${{ needs.firestore-rules.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed Plugin Distribution | ${{ needs.verify-deployed-plugins.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Debug APKs | ${{ needs.build-debug.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ABIs Built" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ arm64-v8a (64-bit ARM — Pixel, Samsung, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ armeabi-v7a (32-bit ARM — older devices)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ x86_64 (64-bit — emulator/Intel)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ x86 (32-bit — legacy emulator)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ universal (all ABIs combined)" >> $GITHUB_STEP_SUMMARY
