name: Build MangaWorld APK

permissions:
  contents: read

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      testlab_device:
        description: 'Test Lab device override (blank = the default virtual matrix). Physical models cost real quota.'
        required: false
        default: ''
        type: string
  # Daily drift watch for the deployed plugin distribution. Promotion is a manual
  # `vercel --prod`, so drift can appear (or a fix can go missing) with no commit
  # at all — the scheduled run is the only check that notices on a quiet day.
  schedule:
    - cron: '17 6 * * *'

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

concurrency:
  # github.event_name in the group: the daily schedule lands on refs/heads/main,
  # the same ref as a main push, so with the old group the 06:17 drift run and a
  # real build cancelled each other (only one survives). Separate groups per event;
  # the schedule additionally never cancels and is never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # ─── Lint & Unit Tests ──────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    # U-01: tag pushes run the gates too — a tag must never bypass lint/tests.
    # The daily `schedule` trigger exists for the deployed-distribution drift
    # check alone (which is a few public GETs), so the Android pipeline stands
    # down for it — every push/PR/tag path runs the checks.
    if: "github.event_name != 'schedule'"
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify committed Room schemas 8..16
        run: |
          set -euo pipefail
          # U-08: the full migration chain test (MigrationDeviceTest, on
          # device) now runs against committed 8..16 JSONs. Fail fast here
          # if any version is missing instead of discovering it on devices.
          #
          # Backfill provenance: 14..16 are KSP-original exports (byte-stable
          # against the :app:kspDebugKotlin artifact). 8..13 are backfilled
          # derivations reconstructed from the historical MIGRATION_8_9…_12_13
          # statements (chain-test-derived, NOT KSP-originals) — they exist so
          # the 8→16 chain can execute at all. Do NOT byte-compare 16.json
          # here: KSP regenerates it client-side on every build, so a byte
          # check can never hold on main. The executed proof is the on-device
          # MigrationDeviceTest (14→16, 15→16, guard) — not this presence
          # check. See tmp/plan/adversarial-fixes/p0-release-blockers.md (U-08).
          dir="app/schemas/com.exapps.mangaworld.core.data.local.MangaDatabase"
          for v in 8 9 10 11 12 13 14 15 16; do
            if [[ ! -f "$dir/$v.json" ]]; then
              echo "::error::Missing Room schema $dir/$v.json — run :app:kspDebugKotlin and commit the export."
              exit 1
            fi
          done
          echo "Room schemas 8..16 present."

      - name: Cancellation-safety gate (U-13)
        # The Stage-1/2 sweep converted every bare runCatching whose lambda
        # awaits a suspend function; the remaining bare sites are provably
        # sync (JSON/regex parsing, sync IO, telemetry sinks). The gate
        # therefore detects the ACTUAL defect - a bare runCatching block whose
        # body awaits a suspend call - and FAILS the job when one appears
        # (a sweep regression, not the current baseline).
        run: |
          set -uo pipefail
          python3 scripts/cancellation_gate.py app/src/main/kotlin
          # The same trap can be re-introduced in the test tree (a test that
          # swallows a cancellation hides a real bug in the code it exercises).
          python3 scripts/cancellation_gate.py app/src/test

      - name: 900-line gate for NEW files (U-35)
        # New files (added in this diff) must be <=900 lines. Existing files
        # over 900 are grandfathered (tracking splits in
        # tmp/review/stage2/arch-hygiene.md) — this gate only stops the
        # pile from growing. Base discovery: PR base SHA, else push
        # `before`, else HEAD^; if none resolves, skip with a warning
        # instead of failing an infrastructure edge case.
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE="${PR_BASE_SHA:-$BEFORE_SHA}"
          if [[ -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || echo "")
          fi
          if [[ -z "$BASE" ]]; then
            echo "::warning::U-35 gate: no base commit resolvable (manual dispatch?) — skipping new-file size check."
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE" >/dev/null 2>&1; then
            echo "::warning::U-35 gate: base commit $BASE not fetchable — skipping new-file size check."
            exit 0
          fi
          fail=0
          while IFS= read -r f; do
            [[ -z "$f" || ! -f "$f" ]] && continue
            # Test specs are behavior pins, not shipped code — the size
            # discipline targets production modules (the gate's purpose).
            case "$f" in *Test.kt|*test.ts) continue;; esac
            lines=$(wc -l < "$f" | tr -d ' ')
            if [[ "$lines" -gt 900 ]]; then
              echo "::error::U-35: new file $f has $lines lines (>900). Split it into smaller classes/files."
              fail=1
            fi
          done < <(git diff --name-only --diff-filter=A "$BASE" HEAD)
          if [[ "$fail" -eq 0 ]]; then echo "U-35 gate: no new file over 900 lines."; fi
          exit $fail

      - name: Import-census boundary ratchet (U-36)
        # Presentation must not import core.data implementation classes
        # (concrete managers/DAOs/entities) — this codebase has no literal
        # `core.data.impl` package, so the census greps the real boundary
        # path.
        #
        # Promotion to error mode is NOT feasible yet (55 imports across 24
        # files), so this is a RATCHET: the build fails when the count goes
        # ABOVE the recorded baseline. That still stops the debt from
        # growing, which a warning-only step never did — and a step that
        # cannot fail is indistinguishable from a step that never ran.
        #
        # Lower BASELINE when the debt is actually paid down; never raise it.
        env:
          IMPORT_CENSUS_BASELINE: '55'
        run: |
          set -uo pipefail
          P_DIR=app/src/main/kotlin/com/exapps/mangaworld/presentation
          HITS_FILE=$(mktemp)
          grep -rn "^import com.exapps.mangaworld.core.data" "$P_DIR" --include="*.kt" > "$HITS_FILE" || true
          hits=$(wc -l < "$HITS_FILE" | tr -d ' ')
          files=$(cut -d: -f1 "$HITS_FILE" | sort -u | wc -l | tr -d ' ')
          echo "presentation -> core.data imports: $hits import(s) across $files file(s) (baseline ${IMPORT_CENSUS_BASELINE})"
          if [[ "$hits" -gt "$IMPORT_CENSUS_BASELINE" ]]; then
            echo "::error::U-36 boundary ratchet — $hits imports exceed the baseline ${IMPORT_CENSUS_BASELINE}. Migrate the offending screens behind domain interfaces, or lower the baseline only if the count really dropped."
            cut -d: -f1 "$HITS_FILE" | sort | uniq -c | sort -rn | head -n 10
            rm -f "$HITS_FILE"
            exit 1
          fi
          if [[ "$hits" -gt 0 ]]; then
            echo "::notice::U-36 boundary census — remaining presentation -> core.data imports (top files):"
            cut -d: -f1 "$HITS_FILE" | sort | uniq -c | sort -rn | head -n 10
          fi
          rm -f "$HITS_FILE"

      - name: Create google-services.json from secret
        # U-05: job-level env cannot be conditional, so gate the consuming
        # step — PR code must never materialize the secret.
        if: github.event_name != 'pull_request' && env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Create stub google-services.json for PRs
        # U-05 companion: PRs (same-repo and forks alike) no longer get the
        # real secret, but the google-services Gradle plugin fails config
        # without the file — write a structurally valid stub (dummy ids,
        # com.exapps.mangaworld package) so lint/tests compile on PRs.
        if: github.event_name == 'pull_request'
        run: |
          cat > app/google-services.json << 'STUB'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "mangaworld-pr-stub",
              "storage_bucket": "mangaworld-pr-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {"package_name": "com.exapps.mangaworld"}
                },
                "oauth_client": [],
                "api_key": [{"current_key": "stub"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          STUB

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_DIR" ]]; then
            for CANDIDATE in /usr/local/lib/android/sdk /opt/android-sdk /opt/hostedtoolcache/Android/Sdk; do
              if [[ -d "$CANDIDATE" ]]; then
                SDK_DIR="$CANDIDATE"
                break
              fi
            done
          fi
          if [[ -z "$SDK_DIR" ]]; then
            echo "Android SDK directory could not be determined." >&2
            exit 1
          fi
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: wrapper
          # U-05: PR runs must not write to the shared Gradle cache.
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Run Unit Tests
        # Bounded so a hanging test fails the step (partial XMLs still upload
        # via the always() results step) instead of burning the 6h job limit.
        timeout-minutes: 30
        run: ./gradlew :app:testDebugUnitTest --stacktrace


      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

      # Room schemas are the migration safety net: exportSchema=true writes them
      # here on every compile. Published as artifacts so migration review never
      # needs a local build (and so missing schemas fail visibly, not silently).
      # Explicit KSP invocation: the schemas live outside buildDir, so a Gradle
      # cache hit on compile tasks could otherwise skip their regeneration.
      - name: Generate Room Schemas
        run: ./gradlew :app:kspDebugKotlin --stacktrace

      - name: Room schema drift (current version)
        # The Room KSP export is written INTO the source tree by the build
        # (`ksp { arg("room.schemaLocation", "$projectDir/schemas") }`), so
        # after the build the working tree holds a FRESH export of the current
        # version. If it differs from the committed file, the committed schema
        # is stale or hand-made -> red. (The historical 8..13 files are
        # regenerated by .github/workflows/schema-backfill.yml and committed
        # from its artifacts.)
        run: |
          set -uo pipefail
          if git diff --quiet -- app/schemas; then
            echo "Room schema export matches the committed files."
          else
            echo "::error::Room schema drift — the build regenerated a different export. Commit the regenerated file(s):"
            git diff --stat -- app/schemas
            git diff -- app/schemas | head -40
            exit 1
          fi

      - name: Upload Room Schemas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: room-schemas
          path: app/schemas/**/*.json
          if-no-files-found: error
          retention-days: 30

  # ─── Dashboard Checks ───────────────────────────────────────────────────────
  # The admin dashboard ships to Vercel with zero test coverage; at minimum its
  # typecheck must gate like the app's lint/tests do. ESLint stays advisory
  # until the `any`-debt baseline is clean (see F6).
  dashboard-checks:
    name: Dashboard Typecheck & Lint
    runs-on: ubuntu-latest
    # U-01: tag pushes run the gates too (same rationale as lint-and-test). The
    # daily schedule skips it too, but re-runs the signature gate it owns through
    # verify-deployed-plugins so the committed tree stays covered on quiet days.
    if: "github.event_name != 'schedule'"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Typecheck
        working-directory: dashboard
        run: npm run typecheck

      - name: Unit tests
        working-directory: dashboard
        run: npm test

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Plugin distribution checks
        # 3.5/4.3: dashboard-only edits (index typo, manifest host swap,
        # pin drift, sha256 mismatch) merge with no app-side cover.
        run: |
          python3 -m pip install --quiet cryptography
          python3 dashboard/scripts/sign-plugin.py --selftest
          python3 dashboard/scripts/sign-plugin.py --check-published

  # ─── Firestore Rules Verification ───────────────────────────────────────────
  # Boots the Firestore emulator with the shipped rules + indexes and replays
  # the app's exact public-library query (visitor/owner/denied/legacy/anon).
  # A rules change that breaks provability or privacy fails here instead of in
  # prod (PL-1). U-01: tag pushes run like every other check job; only the daily
  # schedule skips it (an emulator boot per day for a plugin-drift watch is not a trade).
  firestore-rules:
    name: Firestore Rules Verification
    runs-on: ubuntu-latest
    if: "github.event_name != 'schedule'"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up JDK 21 (Firestore emulator requirement)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify rules in emulator
        run: firebase emulators:exec --only firestore "node scripts/verify-firestore-rules.mjs"
        working-directory: dashboard

  # ─── Deployed Plugin Distribution ───────────────────────────────────────────
  # --check-published proves the COMMITTED tree is signed and well-formed. It
  # cannot see what is actually SERVED: vercel.json sets deploymentEnabled:false
  # and promotion is a manual `vercel --prod`, so the distribution once "had NEVER
  # been live" with every repository-side check green. This job is the other half
  # — it reads the live bytes and re-verifies them with the same JCS/Ed25519 code
  # path and the same committed public pin the app uses, so a tampered payload, a
  # manifest host swap, a swapped source.js, a missing promotion or an expiring
  # trust anchor fails CI even when nobody pushes.
  # READ-ONLY: public GETs, no secrets (the distribution is public and the pin is
  # a committed public key), no deploy, no write outside the runner's temp dir.
  # NOT in build-release's needs on purpose: served state is an external service,
  # and a Vercel hiccup must not be able to block a release that is otherwise
  # green. Drift surfaces here (red on push/PR, red daily) instead.
  verify-deployed-plugins:
    name: Verify Deployed Plugins
    runs-on: ubuntu-latest
    # Tag pushes only cut the release. Every other trigger runs it: main pushes,
    # PRs (so a distribution change can never be reviewed blind) and the daily
    # schedule (so drift is caught on a quiet day, not just on a commit).
    if: "!startsWith(github.ref, 'refs/tags/')"
    env:
      PLUGIN_INDEX_URL: https://mangaworld-admin.vercel.app/plugins/index.json
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install crypto dependency
        # Same single dependency the existing signature gate uses (Ed25519).
        run: python3 -m pip install --quiet --disable-pip-version-check cryptography

      # Committed-tree side of the plugin gate. Redundant with dashboard-checks on
      # push/PR (identical command, identical signal), but the daily schedule does
      # not run that job — so without this step the distribution would only be
      # re-checked on days somebody happened to push.
      - name: Committed distribution + pin agreement
        run: |
          python3 dashboard/scripts/sign-plugin.py --selftest
          python3 dashboard/scripts/sign-plugin.py --check-published

      - name: Verify served distribution
        # `runner.temp` is NOT available in job-level env (GitHub rejects the
        # workflow file outright), so the mirror path is a step-level env.
        env:
          PLUGIN_MIRROR: ${{ runner.temp }}/deployed-plugins
        run: |
          set -euo pipefail
          mkdir -p "$PLUGIN_MIRROR"
          python3 dashboard/scripts/verify-deployed-plugins.py \
            --index-url "$PLUGIN_INDEX_URL" \
            --pin-source dashboard/lib/plugin-keys.ts \
            --mirror "$PLUGIN_MIRROR" \
            --archive-dir dashboard/plugins/_archive \
            --trust-window-days 90 \
            --warn-window-days 30

      - name: Upload served bytes (failure forensics)
        # The exact bytes that were served, so a promotion that shipped something
        # else cannot hide behind a green re-run.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployed-plugins-mirror
          path: ${{ env.PLUGIN_MIRROR }}
          if-no-files-found: ignore
          retention-days: 30

  # ─── Firebase Test Lab ──────────────────────────────────────────────────────
  # On-device plugin invariants. The JVM suite cannot touch the real APK assets,
  # the real Room index or the real boot path -- which is exactly where the
  # "source vanished from every list" class of bug lives (a record with a version
  # but no runner is filtered out of Home/Browse/Search, so the user sees nothing
  # and no error). Test Lab installs the app FRESH on every run, so this is also
  # the only place the first-install path is exercised continuously.
  #
  # NOT in build-release's needs: a release must not be blocked by device
  # infrastructure. It is reported in the summary and fails the branch on a real
  # regression. Promote it to a release gate once it has proven stable.
  firebase-test-lab:
    name: Firebase Test Lab (on-device plugin invariants)
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # Three virtual devices spanning the support window: API 26 is the app's
      # minSdk, 30 is the long tail of real devices, 34 is the current target.
      # Fresh install on every one -- the condition no long-lived device provides.
      # Physical models (Pixel 10 Pro, Galaxy S25 Ultra) exist but cost real quota.
      TESTLAB_DEVICES: >-
        model=MediumPhone.arm,version=26
        model=MediumPhone.arm,version=30
        model=MediumPhone.arm,version=34
      # A dispatch can override the matrix with a single physical model, so a drill
      # can be re-run on real hardware on demand (Pixel 10 Pro, Galaxy S25 Ultra…).
      TESTLAB_DEVICE_OVERRIDE: ${{ inputs.testlab_device }}
    if: |
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Create google-services.json from secret
        # The Google Services plugin refuses to run without it, so the debug
        # build fails before a single test is compiled.
        # U-05: gate the consuming step — PR code must never materialize the secret.
        if: github.event_name != 'pull_request' && env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Create stub google-services.json for PRs
        # U-05 companion: PRs get no real secret (see lint-and-test).
        if: github.event_name == 'pull_request'
        run: |
          cat > app/google-services.json << 'STUB'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "mangaworld-pr-stub",
              "storage_bucket": "mangaworld-pr-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {"package_name": "com.exapps.mangaworld"}
                },
                "oauth_client": [],
                "api_key": [{"current_key": "stub"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          STUB

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5 (normalized from v4)
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-testlab-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-testlab-${{ runner.os }}-

      - name: Build debug + androidTest APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Activate the service account
        # U-05: the service account is privileged — never activate it on PRs.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          gcloud config set project mangaworld-live-260519

      - name: Run on-device plugin invariants
        # U-05: depends on the service-account auth above; skip it on PRs too
        # (it would otherwise fail unauthenticated instead of skipping cleanly).
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Discover by name, not by a guessed path: AGP's androidTest output name
          # differs from the app's, and a wrong glob fails the run before Test Lab
          # is even reached.
          echo "apk outputs:"; find app/build/outputs/apk -name "*.apk" || true
          # Prefer the universal APK (one artifact for every ABI the device may be);
          # fall back to whatever the build produced.
          app_apk=$(find app/build/outputs/apk/debug -name "app-universal-debug.apk" | head -n 1)
          if [[ -z "$app_apk" ]]; then
            app_apk=$(find app/build/outputs/apk/debug -name "*.apk" ! -name "*androidTest*" | head -n 1)
          fi
          test_apk=$(find app/build/outputs/apk/androidTest -name "*androidTest*.apk" | head -n 1)
          if [[ -z "$app_apk" || -z "$test_apk" ]]; then
            echo "::error::could not locate the app/test APKs"; exit 1
          fi
          echo "app=$app_apk"
          echo "test=$test_apk"
          # No --results-bucket: the CLI provisions its own staging/results bucket.
          # A named bucket in this project cannot be created (the project's
          # billing account is not in an enabled state), so the default path is
          # the only one that works here.
          # `set -e` + `pipefail` abort the step AT this pipeline, so the quota
          # check below never ran (the job still failed on TEST_QUOTA_EXCEEDED
          # exactly as before the guard existed). Disable errexit around the
          # call, capture the status, then restore it.
          set +e
          status=0

          gcloud firebase test android run \
            --type instrumentation \
            --app "$app_apk" \
            --test "$test_apk" \
            $(printf -- '--device %s ' ${TESTLAB_DEVICE_OVERRIDE:-$TESTLAB_DEVICES}) \
            --timeout 25m \
            --results-dir="testlab/$(date -u +%Y%m%d-%H%M%S)-${{ github.sha }}" \
            2>&1 | tee testlab-run.log || status=${PIPESTATUS[0]}
          set -e
          # A quota limit is a RESOURCE state, not a test failure: the shared daily
          # budget can be exhausted by an on-demand physical run, and the virtual
          # matrix then cannot even be allocated. Failing the branch on that would
          # make a green pipeline mean "we ran out of minutes", not "we are correct".
          # Skip loudly instead: the day has no on-device coverage, and the summary
          # says so.
          if grep -q "TEST_QUOTA_EXCEEDED\|Insufficient testing quota" testlab-run.log; then
            echo "::warning::Firebase Test Lab quota exhausted — on-device coverage SKIPPED for this run"
            echo "TEST_LAB_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ $status -ne 0 ]]; then
            echo "::error::Firebase Test Lab run failed (exit $status)"
            exit $status
          fi
          echo "TEST_LAB_PASSED=1" >> "$GITHUB_ENV"

      - name: Collect the on-device test report
        # U-05: reads via the service-account auth; skip on PRs (see above).
        if: always() && github.event_name != 'pull_request'
        run: |
          set -uo pipefail
          # The CLI provisions its own RANDOM staging/results bucket (a named
          # bucket cannot be created in this project), so find it by prefix and
          # pull the report out of it -- otherwise a failure leaves no evidence
          # beyond the console URL.
          # The CLI prints the bucket it used ("Raw results will be stored in your
          # GCS bucket at [...]"); buckets.list does NOT show it, so parse the log.
          bucket=$(grep -oE "test-lab-[a-z0-9-]+" testlab-run.log 2>/dev/null | head -n 1)
          echo "results bucket: ${bucket:-none}"
          if [[ -n "${bucket:-}" ]]; then
            mkdir -p testlab
            gcloud storage cp --recursive "gs://${bucket}/testlab" testlab/ || true
            # The raw results include the device video and screenshots: ~130 MB of
            # incompressible media that would drown the artifact. The report and
            # the logcat are what a failure is actually read from.
            find testlab -name "*.mp4" -delete 2>/dev/null || true
            find testlab -type f -size +8M -delete 2>/dev/null || true
          fi

      - name: Upload on-device test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testlab-results
          path: testlab/
          if-no-files-found: ignore
          retention-days: 30

  # ─── Macrobenchmark (device perf gate) ─────────────────────────────────────
  # The DEVICE half of the Stage-2 perf gate (U-26/U-27): the JVM suites
  # prove the logic, this job proves the numbers on a real device
  # (tmp/review/stage2/perf.md §"Measure spec", MB-1 … MB-5).
  #
  # NOT in build-release's `needs:` and NOT a condition of create-release:
  # device infrastructure must never block a release (same policy as the
  # existing firebase-test-lab job). The JOB is continue-on-error, so a
  # failure here never blocks the pipeline.
  #
  # But the job is not allowed to lie. Three levels, from fatal to soft:
  #   1. the BUILD step is FATAL — a harness that does not compile is a
  #      broken gate and fails the job (it used to be swallowed by
  #      BENCH_SKIP=1, which is how a module that never compiled shipped a
  #      "green" perf gate);
  #   2. the DEVICE phase stays skippable (no emulator / no quota), but it
  #      announces the skip loudly and records it in $GITHUB_ENV;
  #   3. the OUTCOME is reported per state: build failed / skipped / a test
  #      failed / EVERY TEST WAS SKIPPED (the gate ran but measured nothing)
  #      / numbers were produced. A run that measured nothing is an ERROR,
  #      never a pass.
  #
  # It runs on a GitHub-hosted emulator instead of Firebase Test Lab on
  # purpose: Test Lab minutes are a shared daily budget in this repo (one
  # on-demand physical run exhausted a day), macrobenchmark wants a device
  # the job controls, and the emulator path costs no quota at all.
  benchmark:
    name: Macrobenchmark (device perf gate)
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    continue-on-error: true
    if: |
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # A virtual device: no physical-device quota, no shared daily budget.
      BENCH_AVD: manga-bench
      BENCH_AVD_IMAGE: system-images;android-30;google_apis;x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Create google-services.json from secret
        # U-05: gate the consuming step — PR code must never materialize the secret.
        if: github.event_name != 'pull_request' && env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Create stub google-services.json for PRs
        # Same stub as the other jobs — the benchmark needs a valid file for
        # the google-services plugin, not a working Firebase project.
        if: github.event_name == 'pull_request'
        run: |
          cat > app/google-services.json << 'STUB'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "mangaworld-pr-stub",
              "storage_bucket": "mangaworld-pr-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {"package_name": "com.exapps.mangaworld"}
                },
                "oauth_client": [],
                "api_key": [{"current_key": "stub"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          STUB

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_DIR" ]]; then
            for CANDIDATE in /usr/local/lib/android/sdk /opt/android-sdk /opt/hostedtoolcache/Android/Sdk; do
              if [[ -d "$CANDIDATE" ]]; then
                SDK_DIR="$CANDIDATE"
                break
              fi
            done
          fi
          if [[ -z "$SDK_DIR" ]]; then
            echo "Android SDK directory could not be determined." >&2
            exit 1
          fi
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build the benchmark APKs
        # :app:assembleBenchmark  -> the app under test (release-like,
        #                               non-debuggable, debug-signed)
        # :benchmark:assembleBenchmark -> the macrobenchmark harness APK
        # :app:assembleDebug + :benchmark:assembleDebug -> the DEBUG
        #                               pairing, which is the only build in
        #                               which the app logs its HTTP requests
        #                               (the exact MB-5 counter).
        #
        # FATAL ON PURPOSE: this step has NO continue-on-error. A harness
        # that does not compile is a broken gate, and it used to be hidden
        # behind `BENCH_SKIP=1` — the job went green while the module had
        # never been built (the `executeShellCommand` -> ParcelFileDescriptor
        # compile error). The job itself stays `continue-on-error: true`
        # (device infrastructure must never block a release), so this fails
        # the JOB loudly without blocking the pipeline.
        shell: bash
        run: |
          set -uo pipefail
          # `|| status=$?` — under the runner's `bash -e` a failing gradle
          # invocation aborts the step before `$?` could ever be read.
          status=0
          ./gradlew :app:assembleBenchmark :benchmark:assembleBenchmark \
                     :app:assembleDebug :benchmark:assembleDebug --stacktrace || status=$?
          echo "BENCH_BUILD_STATUS=$status" >> "$GITHUB_ENV"
          if [[ "$status" -ne 0 ]]; then
            echo "::error title=Benchmark build failed::the :benchmark harness (or the app under test) did not compile. The perf gate is BROKEN, not green — no device phase was run and no numbers exist."
            # The device phase cannot run without the APKs; the skip is
            # recorded so no later step pretends the suite ran.
            echo "BENCH_SKIP=1" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "benchmark build OK"

      - name: Boot the emulator
        id: emulator
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK" ]]; then
            echo "::warning::no Android SDK — the device phase is skipped"
            echo "BENCH_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ ! -e /dev/kvm ]]; then
            echo "::warning::no /dev/kvm on this runner — the device phase is skipped (a software-rendered emulator is too slow to measure)"
            echo "BENCH_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # PATH: the runner image ships the SDK but NOT its bin directories,
          # so `adb` was "command not found" and the boot probe could never
          # succeed. adb/emulator/sdkmanager/avdmanager all live under the
          # SDK, so put them on PATH once, here.
          for BIN in "$SDK/platform-tools" "$SDK/emulator" "$SDK/cmdline-tools/latest/bin"; do
            if [[ -d "$BIN" ]]; then
              echo "$BIN" >> "$GITHUB_PATH"
              export PATH="$BIN:$PATH"
            fi
          done
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          fi
          if [[ -x "$SDKMANAGER" ]]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "emulator" "platform-tools" "$BENCH_AVD_IMAGE" > /dev/null 2>&1 || \
              echo "::warning::sdkmanager could not install every package"
          fi
          AVDMANAGER="$SDK/cmdline-tools/latest/bin/avdmanager"
          if [[ ! -x "$AVDMANAGER" ]]; then
            AVDMANAGER=$(find "$SDK/cmdline-tools" -name avdmanager -type f 2>/dev/null | sort | tail -1)
          fi
          # The AVD must land where the emulator LOOKS for it. Without an
          # explicit --path, `avdmanager create` can exit 0 while writing the
          # .avd somewhere else, and the emulator then dies with
          # "Unknown AVD name [manga-bench]" — the first real failure of this
          # step, invisible because avdmanager's output went to /dev/null.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          # `|| create_status=$?` — the runner's `shell: bash` runs
          # `bash -eo pipefail`, so a failing avdmanager would abort the step
          # at the assignment and the skip path below would never run (the
          # same idiom as the benchmark build step).
          create_status=0
          create_log="$(echo no | "$AVDMANAGER" create avd -n "$BENCH_AVD" -k "$BENCH_AVD_IMAGE" --force --path "$ANDROID_AVD_HOME/$BENCH_AVD.avd" 2>&1)" || create_status=$?
          if [[ "$create_status" -ne 0 ]]; then
            echo "::warning::avdmanager could not create the AVD (exit $create_status):"
            echo "$create_log" | head -20
            echo "BENCH_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # Verify the emulator can actually SEE the AVD before booting it.
          if ! "$SDK/emulator/emulator" -list-avds 2>/dev/null | grep -qx "$BENCH_AVD"; then
            echo "::warning::the AVD '$BENCH_AVD' is not visible to the emulator — the device phase is skipped"
            echo "::warning::avdmanager said:"; echo "$create_log" | head -20
            echo "::warning::emulator -list-avds said:"; "$SDK/emulator/emulator" -list-avds 2>&1 | head -10
            echo "BENCH_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          nohup "$SDK/emulator/emulator" -avd "$BENCH_AVD" \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          adb wait-for-device || true
          booted=0
          # 10 minutes: a cold x86_64 system image on a fresh runner needs
          # longer than the 5 this step originally allowed.
          for _ in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            sleep 5
          done
          if [[ "$booted" != "1" ]]; then
            echo "::warning::the emulator did not boot — the device phase is skipped"
            tail -n 40 /tmp/emulator.log || true
            echo "BENCH_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # Frame timings are meaningless while the system animates.
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell input keyevent 82 || true
          echo "emulator=ready" >> "$GITHUB_ENV"

      - name: Install the app under test and the harness
        id: install
        if: env.BENCH_SKIP != '1'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          app_apk=$(find app/build/outputs/apk/benchmark -name "*universal*.apk" 2>/dev/null | head -n 1)
          if [[ -z "$app_apk" ]]; then
            app_apk=$(find app/build/outputs/apk/benchmark -name "*.apk" 2>/dev/null | head -n 1)
          fi
          harness_apk=$(find benchmark/build/outputs/apk/benchmark -name "*.apk" 2>/dev/null | head -n 1)
          if [[ -z "$harness_apk" ]]; then
            harness_apk=$(find benchmark/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi
          echo "app=$app_apk"
          echo "harness_apk=$harness_apk"
          if [[ -z "$app_apk" || -z "$harness_apk" ]]; then
            echo "::warning::could not locate the benchmark APKs — the device phase is skipped"
            echo "BENCH_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          adb install -r -g "$app_apk" || true
          adb install -r -g "$harness_apk" || true
          # The app asks for a storage permission on first launch; without it
          # a system dialog covers the app and every UI step times out.
          adb shell pm grant com.exapps.mangaworld android.permission.READ_EXTERNAL_STORAGE || true
          adb shell pm grant com.exapps.mangaworld android.permission.READ_MEDIA_IMAGES || true
          # The harness id is discovered, never hardcoded.
          harness=$(adb shell pm list packages | tr -d '\r' | sed -n 's/^package://p' \
            | grep -E '^com\.exapps\.mangaworld\.benchmark' | head -n 1)
          echo "harness=$harness" >> "$GITHUB_OUTPUT"
          if [[ -z "$harness" ]]; then
            echo "::warning::the harness package could not be identified — the device phase is skipped"
            echo "BENCH_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi

      - name: Run the macrobenchmark suite
        id: bench
        if: env.BENCH_SKIP != '1'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          harness="${{ steps.install.outputs.harness }}"
          # `-r` (raw) prints the per-test INSTRUMENTATION_STATUS protocol,
          # which is the ONLY way to tell "the suite passed" from "every
          # test was SKIPPED" — `am instrument` exits 0 in both cases.
          # `|| status=${PIPESTATUS[0]}` — under the runner's `bash -e` with
          # pipefail the failing pipeline aborts the step before `$?`/
          # PIPESTATUS could be read.
          status=0
          adb shell am instrument -w -r \
            -e androidx.benchmark.output.enable=true \
            -e additionalTestOutputDir "/sdcard/Android/data/$harness/files" \
            -e class com.exapps.mangaworld.benchmark.ReaderPerfBenchmarks \
            "$harness/androidx.test.runner.AndroidJUnitRunner" | tee instrumentation.log || status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "BENCH_EXIT_CODE=$status" >> "$GITHUB_ENV"
          # Counts, straight from the instrumentation protocol:
          #   0  = the test finished OK
          #  -2  = the test FAILED
          #  -1  = the test ERRORED
          #  -3  = the test was @Ignore'd
          #  -4  = the test hit an assumption failure (JUnit SKIP)
          passes=$(grep -cE 'INSTRUMENTATION_STATUS_CODE:[[:space:]]*0[[:space:]]*$' instrumentation.log || true)
          failures=$(grep -cE 'INSTRUMENTATION_STATUS_CODE:[[:space:]]*-2[[:space:]]*$' instrumentation.log || true)
          errors=$(grep -cE 'INSTRUMENTATION_STATUS_CODE:[[:space:]]*-1[[:space:]]*$' instrumentation.log || true)
          skipped=$(grep -cE 'INSTRUMENTATION_STATUS_CODE:[[:space:]]*(-3|-4)[[:space:]]*$' instrumentation.log || true)
          echo "BENCH_PASSED=$passes" >> "$GITHUB_ENV"
          echo "BENCH_FAILED=$((failures + errors))" >> "$GITHUB_ENV"
          echo "BENCH_SKIPPED_TESTS=$skipped" >> "$GITHUB_ENV"
          echo "macrobenchmark suite: $passes passed, $((failures + errors)) failed, $skipped skipped (exit $status)"

      - name: Run the exact MB-5 counter (debug pairing)
        id: bench-debug
        if: env.BENCH_SKIP != '1'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          # The exact "requests per source" counter needs the app's DEBUG
          # build (the OkHttp request log is debug-only).
          app_apk=$(find app/build/outputs/apk/debug -name "*universal*.apk" 2>/dev/null | head -n 1)
          harness_apk=$(find benchmark/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [[ -z "$app_apk" || -z "$harness_apk" ]]; then
            echo "::warning title=exact MB-5 counter skipped::the debug APKs are missing — the exact requests-per-source counter did not run"
            echo "BENCH_DEBUG_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          adb uninstall com.exapps.mangaworld > /dev/null 2>&1 || true
          adb install -r -g "$app_apk" || true
          adb install -r -g "$harness_apk" || true
          adb shell pm grant com.exapps.mangaworld android.permission.READ_EXTERNAL_STORAGE || true
          harness=$(adb shell pm list packages | tr -d '\r' | sed -n 's/^package://p' \
            | grep -E '^com\.exapps\.mangaworld\.benchmark' | head -n 1)
          status=0
          adb shell am instrument -w -r \
            -e class com.exapps.mangaworld.benchmark.BrowseRequestBudgetTest \
            "$harness/androidx.test.runner.AndroidJUnitRunner" | tee instrumentation-debug.log || status=${PIPESTATUS[0]}
          echo "BENCH_DEBUG_EXIT_CODE=$status" >> "$GITHUB_ENV"
          passes=$(grep -cE 'INSTRUMENTATION_STATUS_CODE:[[:space:]]*0[[:space:]]*$' instrumentation-debug.log || true)
          failures=$(grep -cE 'INSTRUMENTATION_STATUS_CODE:[[:space:]]*(-1|-2)[[:space:]]*$' instrumentation-debug.log || true)
          skipped=$(grep -cE 'INSTRUMENTATION_STATUS_CODE:[[:space:]]*(-3|-4)[[:space:]]*$' instrumentation-debug.log || true)
          echo "BENCH_DEBUG_PASSED=$passes" >> "$GITHUB_ENV"
          echo "BENCH_DEBUG_FAILED=$failures" >> "$GITHUB_ENV"
          echo "BENCH_DEBUG_SKIPPED_TESTS=$skipped" >> "$GITHUB_ENV"
          echo "exact MB-5 counter: $passes passed, $failures failed, $skipped skipped (exit $status)"

      - name: Collect the benchmark metrics
        if: always() && env.BENCH_SKIP != '1'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          harness="${{ steps.install.outputs.harness }}"
          mkdir -p benchmark-metrics
          adb shell "ls /sdcard/Android/data/$harness/files" || true
          adb pull "/sdcard/Android/data/$harness/files" benchmark-metrics/ || true
          find benchmark-metrics -name "*benchmarkData.json" -print || true
          # The harness's own numbers (MangaWorldBench) — these are the
          # human-readable MB-1..MB-5 lines the suite logs.
          adb logcat -d -s MangaWorldBench:I '*:S' > benchmark-metrics/bench-probes.log 2>/dev/null || true
          echo "---- harness probes (MangaWorldBench) ----"
          cat benchmark-metrics/bench-probes.log 2>/dev/null || echo "(no probe output captured)"

      - name: Print the measured numbers
        if: always() && env.BENCH_SKIP != '1'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          # The androidx.benchmark result JSON (one file per suite run).
          python3 - <<'PY' || true
          import glob, json, os
          files = glob.glob("benchmark-metrics/**/*benchmarkData.json", recursive=True)
          if not files:
              print("no benchmarkData.json was produced — the suite wrote no measurement")
          for path in sorted(files):
              print("== %s" % path)
              try:
                  with open(path, "r", encoding="utf-8", errors="replace") as fh:
                      data = json.load(fh)
              except Exception as exc:  # noqa: BLE001
                  print("   could not parse: %s" % exc)
                  continue
              for entry in data.get("benchmarks", []):
                  print("- %s" % entry.get("name", "?"))
                  for metric, values in (entry.get("metrics") or {}).items():
                      mins = values.get("minimums") or []
                      meds = values.get("medians") or []
                      units = values.get("unit") or ""
                      parts = []
                      if mins:
                          parts.append("min=%s" % mins[0])
                      if meds:
                          parts.append("median=%s" % meds[0])
                      print("    %-34s %s %s" % (metric, " ".join(parts), units))
          PY

      - name: Report the outcome
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          build_status="${BENCH_BUILD_STATUS:-unknown}"
          passed="${BENCH_PASSED:-0}"
          failed="${BENCH_FAILED:-0}"
          skipped_tests="${BENCH_SKIPPED_TESTS:-0}"
          debug_passed="${BENCH_DEBUG_PASSED:-0}"
          debug_failed="${BENCH_DEBUG_FAILED:-0}"
          debug_skipped="${BENCH_DEBUG_SKIPPED_TESTS:-0}"

          {
            echo "## Macrobenchmark (device perf gate)"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| build (gradle) exit | \`$build_status\` |"
            echo "| suite: passed | $passed |"
            echo "| suite: failed | $failed |"
            echo "| suite: skipped (assumption) | $skipped_tests |"
            echo "| exact MB-5 counter: passed / failed / skipped | $debug_passed / $debug_failed / $debug_skipped |"
            echo "| numbers | see the \`benchmark-metrics\` artifact |"
            echo ""
          } > benchmark-summary.md

          if [[ "$build_status" != "0" ]]; then
            echo "::error title=Perf gate broken::the :benchmark module did not compile (gradle exit $build_status). The gate produced NO numbers and must not be read as a pass."
            echo "### Macrobenchmark" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**BUILD FAILED** (gradle exit \`$build_status\`) — the harness does not compile, so the perf gate produced no numbers." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "${BENCH_SKIP:-0}" == "1" ]]; then
            echo "::warning title=Perf gate skipped::the device phase was skipped (no emulator / no quota / APKs missing). The perf gate produced NO numbers — this is not a pass."
            {
              echo ""
              echo "> **SKIPPED** — no device was available, so the perf gate produced no numbers."
            } >> benchmark-summary.md
            echo "### Macrobenchmark" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**SKIPPED** — no device available; the perf gate produced no numbers." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$failed" -gt 0 || "$debug_failed" -gt 0 ]]; then
            echo "::error title=Perf gate failed::$failed suite test(s) and $debug_failed exact-counter test(s) failed. The perf gate did not pass — see the job log and the benchmark-metrics artifact."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**FAILED** — $failed suite failure(s), $debug_failed exact-counter failure(s)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "$passed" -eq 0 && "$debug_passed" -eq 0 ]]; then
            # `am instrument` exits 0 when every test was skipped, so a suite
            # that measured NOTHING looks exactly like a suite that passed.
            # This is the case that must never be reported as green.
            echo "::error title=Perf gate measured nothing::every benchmark test was SKIPPED ($skipped_tests suite, $debug_skipped exact-counter) — the gate ran but produced no numbers. The fixture was probably unreachable."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**MEASURED NOTHING** — all $skipped_tests suite test(s) were skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "::notice title=Perf gate produced numbers::$passed suite test(s) passed ($skipped_tests skipped), $debug_passed exact-counter test(s) passed — see the benchmark-metrics artifact. NO BASELINE has been recorded yet, so these numbers are not yet a comparison."
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**$passed passed / $failed failed / $skipped_tests skipped** — numbers are in the \`benchmark-metrics\` artifact. No baseline has been recorded yet." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the benchmark artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-metrics
          path: |
            benchmark-metrics/
            instrumentation.log
            instrumentation-debug.log
            benchmark-summary.md
          if-no-files-found: ignore
          retention-days: 30

  # ─── Debug Build ────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APKs (All ABIs)
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_APP_DISTRIBUTION_GROUPS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_GROUPS }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    if: |
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both'))
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Create google-services.json from secret
        # U-05: PR code must never materialize the real secret; stub below.
        if: github.event_name != 'pull_request' && env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Create stub google-services.json for PRs
        # U-05 companion (see lint-and-test): PRs get no real secret, but the
        # google-services Gradle plugin fails config without the file.
        if: github.event_name == 'pull_request'
        run: |
          cat > app/google-services.json << 'STUB'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "mangaworld-pr-stub",
              "storage_bucket": "mangaworld-pr-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {"package_name": "com.exapps.mangaworld"}
                },
                "oauth_client": [],
                "api_key": [{"current_key": "stub"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          STUB

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_DIR" ]]; then
            for CANDIDATE in /usr/local/lib/android/sdk /opt/android-sdk /opt/hostedtoolcache/Android/Sdk; do
              if [[ -d "$CANDIDATE" ]]; then
                SDK_DIR="$CANDIDATE"
                break
              fi
            done
          fi
          if [[ -z "$SDK_DIR" ]]; then
            echo "Android SDK directory could not be determined." >&2
            exit 1
          fi
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: wrapper
          # U-05: PR runs must not write to the shared Gradle cache.
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs
        run: ./gradlew :app:assembleDebug --stacktrace

      # Device-test APK for Firebase Test Lab instrumentation runs. Built here
      # (never locally) from app/src/androidTest; uploaded beside the debug
      # APKs so gcloud runs need no local build.
      - name: Build AndroidTest APK
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      # U-04: PRs must build the release variant too (compile/dex/R8 check).
      # Unsigned on purpose — no signing secrets on PRs; assembleRelease
      # without a signing config still exercises the full release pipeline.
      - name: Build Release APKs (unsigned PR check)
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Resolve Firebase app id
        if: github.event_name == 'push'
        id: firebase-app
        shell: bash
        run: |
          set -euo pipefail
          app_id=$(python -c "import json; print(json.load(open('app/google-services.json', 'r', encoding='utf-8'))['client'][0]['client_info']['mobilesdk_app_id'])")
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for Firebase CLI
        if: github.event_name == 'push' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        if: github.event_name == 'push' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npm install -g firebase-tools

      - name: Distribute internal debug build
        if: github.event_name == 'push' && env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*universal*.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No universal debug APK found; skipping App Distribution."
            exit 0
          fi
          groups="${FIREBASE_APP_DISTRIBUTION_GROUPS:-internal-testers}"
          # Tag/branch names are pusher-controlled: sanitize before interpolation
          # or a crafted tag name breaks out of the release-notes string (F3).
          safe_ref="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/_}"
          firebase appdistribution:distribute "${apks[0]}" \
            --app "${{ steps.firebase-app.outputs.app_id }}" \
            --groups "$groups" \
            --release-notes "Internal debug build from ${safe_ref} (${GITHUB_SHA::7})"

      - name: List APK files
        run: find app/build/outputs/apk -name "*.apk" -type f

      - name: Upload arm64-v8a Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MangaWorld-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MangaWorld-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MangaWorld-debug-x86_64
          path: app/build/outputs/apk/debug/*x86_64*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MangaWorld-debug-x86
          path: |
            app/build/outputs/apk/debug/*x86*.apk
            !app/build/outputs/apk/debug/*x86_64*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Universal Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MangaWorld-debug-universal
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AndroidTest APK (FTL instrumentation)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MangaWorld-debug-androidTest
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # ─── Release Build ──────────────────────────────────────────────────────────
  build-release:
    name: Build Release APKs (All ABIs)
    runs-on: ubuntu-latest
    # dashboard-checks owns the plugin signature gate (--selftest /
    # --check-published): without it here, a mis-signed or tampered promoted
    # manifest shipped in a release APK with every check green (audit C1).
    needs: [lint-and-test, dashboard-checks, firestore-rules]
    # U-01: the check jobs now run on tag pushes too, so a tag no longer
    # bypasses them — green lint/tests/dashboard(signature gate)/rules is
    # required on every path that builds a release. A `failure`/`skipped`
    # check result blocks the release build.
    if: |
      always() && needs.lint-and-test.result == 'success' && needs.dashboard-checks.result == 'success' && needs.firestore-rules.result == 'success' && (
        github.event_name == 'push' ||
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both'))
      )
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      verified: ${{ steps.cert-verify.outputs.verified }}
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_APP_DISTRIBUTION_GROUPS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_GROUPS }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Create google-services.json from secret
        if: env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_DIR" ]]; then
            for CANDIDATE in /usr/local/lib/android/sdk /opt/android-sdk /opt/hostedtoolcache/Android/Sdk; do
              if [[ -d "$CANDIDATE" ]]; then
                SDK_DIR="$CANDIDATE"
                break
              fi
            done
          fi
          if [[ -z "$SDK_DIR" ]]; then
            echo "Android SDK directory could not be determined." >&2
            exit 1
          fi
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── Keystore setup ──────────────────────────────────────────────────────
      - name: Determine release signing status
        id: signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Using signed release build."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release artifacts will be unsigned and will not be distributed."
          fi

      - name: Build Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace

      - name: Resolve Firebase app id
        if: github.event_name == 'push' && steps.signing.outputs.signed == 'true'
        id: firebase-app
        shell: bash
        run: |
          set -euo pipefail
          app_id=$(python -c "import json; print(json.load(open('app/google-services.json', 'r', encoding='utf-8'))['client'][0]['client_info']['mobilesdk_app_id'])")
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for Firebase CLI
        if: github.event_name == 'push' && steps.signing.outputs.signed == 'true' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        if: github.event_name == 'push' && steps.signing.outputs.signed == 'true' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npm install -g firebase-tools

      - name: Distribute internal release build
        id: cert-verify
        if: github.event_name == 'push' && steps.signing.outputs.signed == 'true' && env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        shell: bash
        # U-02: no continue-on-error — a fingerprint mismatch must fail the job
        # (and leave `verified` unset, so create-release cannot publish).
        # The RELEASE_CERT_SHA256 secret is UNSET in this repo (pre-existing):
        # silently skipping (the old continue-on-error no-op) is what U-02
        # flags; hard-blocking all publishes is equally wrong, so an unset
        # secret passes WITH a loud warning — set the secret to make the gate
        # enforce. A set-but-mismatched secret still fails hard.
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*universal*.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No universal release APK found; skipping App Distribution."
            exit 0
          fi
          # NOTE (2026-11-09): keytool -printcert CANNOT read v2/v3-scheme-only
          # APKs ("Not a signed jar file"). apksigner also is NOT on PATH in
          # GitHub's hosted runners — resolve it from build-tools explicitly
          # (the bare invocation silently fails under 2>/dev/null + pipefail).
          # The digest line is public data and is printed unconditionally so
          # the fingerprint is always inspectable (the RELEASE_CERT_SHA256
          # secret fingerprints the SAME cert).
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort | tail -1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "apksigner not found under $ANDROID_HOME/build-tools (needed for fingerprint)." >&2
            exit 1
          fi
          # NB: --verbose would be useful but its info goes to stderr; stdout
          # carries the per-signer digest lines we grep. (First failure was
          # `2>/dev/null` silently eating an empty verbose stream under
          # pipefail, and the bare `apksigner` lookup failing on the PATH.)
          # The extraction pipeline must NEVER fail the step via pipefail:
          # no-match (grep exit 1) would otherwise make `set -e` abort at the
          # assignment — masking everything. `|| true` first, diagnose after.
          # apksigner prints the digest with OR without colons depending on
          # the build-tools version ("SHA-256 digest: aabb…" vs "aa:bb:…"),
          # so take whatever follows the label and strip separators.
          actual_fingerprint=$("$APKSIGNER" verify --print-certs "${apks[0]}" 2>/dev/null \
            | grep -i "SHA-256 digest" | head -1 \
            | sed 's/.*digest:[[:space:]]*//' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]') || true
          echo "release cert SHA-256: ${actual_fingerprint:-<empty>}"
          if [[ -z "$actual_fingerprint" ]]; then
            echo "Could not extract the certificate fingerprint (apksigner found nothing)." >&2
            exit 1
          fi
          if [[ -z "${RELEASE_CERT_SHA256:-}" ]]; then
            echo "::warning::RELEASE_CERT_SHA256 is not set — fingerprint check passes WITH this warning (U-02: set the secret to enforce cert gating). Actual: ${actual_fingerprint}"
            echo "verified=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected_fingerprint=${RELEASE_CERT_SHA256//:/}
          if [[ "${actual_fingerprint^^}" != "${expected_fingerprint^^}" ]]; then
            echo "Release certificate fingerprint verification failed." >&2
            exit 1
          fi
          echo "Release certificate fingerprint verified."
          echo "verified=true" >> "$GITHUB_OUTPUT"
          groups="${FIREBASE_APP_DISTRIBUTION_GROUPS:-internal-testers}"
          safe_ref="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/_}"
          firebase appdistribution:distribute "${apks[0]}" \
            --app "${{ steps.firebase-app.outputs.app_id }}" \
            --groups "$groups" \
            --release-notes "Internal release build from ${safe_ref} (${GITHUB_SHA::7})"

      - name: List output files
        run: |
          echo "=== APKs ==="
          find app/build/outputs/apk -name "*.apk" -type f

      # ── Upload APKs per ABI ─────────────────────────────────────────────────
      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MangaWorld-release-arm64-v8a
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload armeabi-v7a Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MangaWorld-release-armeabi-v7a
          path: app/build/outputs/apk/release/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload x86 Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MangaWorld-release-x86
          path: |
            app/build/outputs/apk/release/*x86*.apk
            !app/build/outputs/apk/release/*x86_64*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload x86_64 Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MangaWorld-release-x86_64
          path: app/build/outputs/apk/release/*x86_64*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MangaWorld-release-universal
          path: app/build/outputs/apk/release/*universal*.apk
          if-no-files-found: error
          retention-days: 90

      # v9.1.5: R8 mapping for deobfuscating fleet logcat stacks (the minified
      # `sync manonga -> p` dead end). Never shipped in-app; CI artifact only.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MangaWorld-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

  # ─── GitHub Release ─────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # build-release already gates on dashboard-checks; naming it here too records
    # the plugin signature gate on the publishing job itself, so a future edit to
    # build-release's condition cannot silently unhook it from the release DAG.
    needs: [build-release, dashboard-checks]
    # always(): without it, a skipped need would transitively skip this job
    # before its condition is even evaluated (same trap as build-release had).
    # U-01: dashboard-checks now runs on tag pushes and build-release requires
    # its success, so gating on build-release (success + U-02 `verified`
    # fingerprint output) transitively gates on the signature check too.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build-release.result == 'success' && needs.build-release.outputs.verified == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require signed build for publication
        run: |
          if [[ "${{ needs.build-release.outputs.signed }}" != "true" ]]; then
            echo "::warning::Release build was unsigned — publication skipped."
            echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Download all APK artifacts
        if: env.SKIP_PUBLISH != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: MangaWorld-release-*
          merge-multiple: false
          path: release-artifacts/

      - name: List downloaded artifacts
        if: env.SKIP_PUBLISH != 'true'
        run: find release-artifacts -type f

      - name: Create Release
        if: env.SKIP_PUBLISH != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MangaWorld ${{ github.ref_name }}"
          body: |
            ## 📦 MangaWorld ${{ github.ref_name }}

            ### ما الجديد للمستخدمين
            تم إصلاح عدم ظهور صور الأغلفة والفصول، وأضيف تنبيه داخل التطبيق عند توفر إصدار جديد.

            ### الحد الأدنى المدعوم
            النسخة `9.7.1` هي الحد الأدنى المدعوم.
            إذا كان إصدار جهازك أقدم من `9.7.1`، فحدّث التطبيق الآن — الإصدارات الأقدم قد لا تعرض صور الأغلفة والفصول بشكل صحيح.

            (minimum supported version: `9.7.1`)

            ### التنزيل
            التطبيق غير متوفر على متجر Google Play — التنزيل من GitHub Releases فقط.

            رابط التحميل المباشر:
            https://github.com/shinzero-code-test/MangaWorldApp/releases/tag/${{ github.ref_name }}

            اختر APK المناسب لجهازك:

            | الجهاز | الملف |
            |--------|-------|
            | معظم الأجهزة الحديثة (64-bit) | `MangaWorld-release-arm64-v8a` |
            | أجهزة قديمة (32-bit) | `MangaWorld-release-armeabi-v7a` |
            | محاكي (x86_64) | `MangaWorld-release-x86_64` |
            | جميع الأجهزة (universal) | `MangaWorld-release-universal` |

            ### المصادر المدعومة
            - ✅ Olympus Staff / تيم اكس (olympustaff.com)
            - ✅ Azora Moon (azorafly.com)
            - ✅ Manga Starz (starzmanga.com)
            - ✅ MangaSid (mangasid.com)
            - ✅ MeshManga / مانجا سوات (meshmanga.com)
            - ✅ مانجا العاشق (3asq.online)
            - ✅ مانجا ليك (mangalik.net)
            - ✅ مانجا ليك اونلاين (lekmanga.online)
            - ✅ مانجا لايك (like-manga.net)
            - ✅ مانجا لينك (link-manga.net)
            - ✅ مانجا ليكو (manga-leko.site)
            - ✅ مانجا ليونز (manga-lionz.org)
            - ✅ آريا مانجا (ar.kenmanga.com)
            - ✅ حجالة مانجا (hijala.com)
            - ✅ لاڤا سكانز (lavascans.com)
            - ✅ StellarSaber (stellarsaber.pro)
            - ✅ ProChan (procomic.pro)

            ### المتطلبات
            - Android 8.0+ (API 26)
          files: |
            release-artifacts/**/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          fail_on_unmatched_files: true

  # ─── Artifact Verification ───────────────────────────────────────────────────
  verify-debug-artifacts:
    name: Verify Debug Artifacts
    runs-on: ubuntu-latest
    needs: build-debug
    if: always() && needs.build-debug.result == 'success'
    steps:
      - name: Download debug artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: MangaWorld-debug-*
          merge-multiple: true
          path: verify-debug/

      - name: Ensure debug APKs exist
        shell: bash
        run: |
          set -euo pipefail
          count=$(find verify-debug -type f -name "*.apk" | wc -l | tr -d ' ')
          echo "Debug APK count: $count"
          if [[ "$count" -lt 1 ]]; then
            echo "No debug APK artifacts found." >&2
            exit 1
          fi

  verify-release-artifacts:
    name: Verify Release Artifacts
    runs-on: ubuntu-latest
    needs: build-release
    if: always() && needs.build-release.result == 'success'
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: MangaWorld-release-*
          merge-multiple: true
          path: verify-release/

      - name: Ensure release APKs exist
        shell: bash
        run: |
          set -euo pipefail
          apk_count=$(find verify-release -type f -name "*.apk" | wc -l | tr -d ' ')
          echo "Release APK count: $apk_count"
          if [[ "$apk_count" -lt 1 ]]; then
            echo "No release APK artifacts found." >&2
            exit 1
          fi

  # ─── Build Summary ──────────────────────────────────────────────────────────
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [ lint-and-test, dashboard-checks, firestore-rules, verify-deployed-plugins, firebase-test-lab, benchmark, build-debug, verify-debug-artifacts, build-release, verify-release-artifacts, create-release ]
    if: always()
    steps:
      - name: Debug release gating contexts
        run: |
          echo "ref=${{ github.ref }}"
          echo "build-release result=${{ needs.build-release.result }}"
          echo "signed output=[${{ needs.build-release.outputs.signed }}]"
      - name: Summary
        run: |
          echo "## 🎌 MangaWorld Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Tests | ${{ needs.lint-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard & Plugin Signature Gate | ${{ needs.dashboard-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firestore Rules | ${{ needs.firestore-rules.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed Plugin Distribution | ${{ needs.verify-deployed-plugins.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Macrobenchmark (device perf gate) | ${{ needs.benchmark.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Debug APKs | ${{ needs.build-debug.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ABIs Built" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ arm64-v8a (64-bit ARM — Pixel, Samsung, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ armeabi-v7a (32-bit ARM — older devices)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ x86_64 (64-bit — emulator/Intel)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ x86 (32-bit — legacy emulator)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ universal (all ABIs combined)" >> $GITHUB_STEP_SUMMARY
